groups:
  - name: release-readiness
    rules:
      # The denominator clamp keeps an idle system from reporting an error ratio.
      - alert: ReleaseReviewHighErrorRatio
        expr: sum(rate(release_reviews_total{status="error"}[5m])) / clamp_min(sum(rate(release_reviews_total[5m])), 0.000001) > 0.20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of release reviews fail
          description: Inspect agent, MCP and model errors; ready and blocked are completed business verdicts, while error is a technical failure.
      # Local models may be slow; this threshold reflects the demonstration budget.
      - alert: ReleaseReviewHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(release_review_duration_seconds_bucket[5m]))) > 180
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Release review p95 exceeds 180 seconds
          description: Inspect model latency and tool-call duration before increasing timeouts.
      - alert: ReleaseReviewAgentUnavailable
        expr: up{job="agent"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Release review agent cannot be scraped
          description: The agent target is unreachable or its metrics endpoint fails; this is not an end-to-end workflow check.
