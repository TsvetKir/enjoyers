apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.podLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.api.spread.mode "topologySpreadConstraints" }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.spread.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.api.spread.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.api.spread.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "shop.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      {{- else if eq .Values.api.spread.mode "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.api.spread.podAntiAffinity.weight }}
              podAffinityTerm:
                topologyKey: {{ .Values.api.spread.podAntiAffinity.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    {{- include "shop.selectorLabels" (dict "root" . "component" "api") | nindent 20 }}
      {{- else }}
      {{- fail "api.spread.mode must be topologySpreadConstraints or podAntiAffinity" }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: API_ADDR
              value: ":{{ .Values.api.service.port }}"
            - name: DATABASE_URL
              value: {{ .Values.api.env.databaseUrl | quote }}
            - name: HEALTH_FAIL
              value: {{ .Values.api.env.healthFail | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
