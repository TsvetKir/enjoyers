api:
  replicaCount: 3
  pdb:
    enabled: true
    minAvailable: 2
  spread:
    mode: topologySpreadConstraints
    topologySpreadConstraints:
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    podAntiAffinity:
      topologyKey: kubernetes.io/hostname
      weight: 100
  image:
    repository: ghcr.io/kirill-lab/shop-api
    tag: "1.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  health:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  env:
    databaseUrl: postgres://shop:shop@postgres-rw:5432/shop?sslmode=disable
    healthFail: "false"
  resources:
    requests:
      cpu: 37m
      memory: 100Mi
    limits:
      cpu: 37m
      memory: 100Mi

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/kirill-lab/shop-worker
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  health:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  env:
    databaseUrl: postgres://shop:shop@postgres-rw:5432/shop?sslmode=disable
    pollInterval: 2s
  resources:
    requests:
      cpu: 38m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 100Mi

batch:
  replicaCount: 1
  image:
    repository: ghcr.io/kirill-lab/shop-batch
    tag: "1.0"
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: lab4-worker
  memoryMB: 768
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1Gi

postgres:
  enabled: true
  name: postgres
  instances: 1
  enablePDB: true
  database: shop
  owner: shop
  credentialsSecret: shop-db-app
  password: shop
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

monitoring:
  enabled: true
  releaseLabel: monitoring
  interval: 15s
  dashboard:
    enabled: true
  alerts:
    enabled: true
    unavailableFor: 1m
    errorRate: 0.10
    latencySeconds: 1
    evaluationWindow: 2m
    for: 2m
    minRequests: 20

priorityClasses:
  critical:
    name: lab4-shop-critical
    value: 10000
    preemptionPolicy: PreemptLowerPriority
  background:
    name: lab4-shop-background
    value: -1000
    preemptionPolicy: Never