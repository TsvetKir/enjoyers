apiVersion: v1
kind: Pod
metadata:
  name: violation-untrusted-image
  labels:
    app.kubernetes.io/name: violation-untrusted-image
    app.kubernetes.io/part-of: shop
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        runAsNonRoot: true
