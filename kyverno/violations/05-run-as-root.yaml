apiVersion: v1
kind: Pod
metadata:
  name: violation-run-as-root
  labels:
    app.kubernetes.io/name: violation-run-as-root
    app.kubernetes.io/part-of: shop
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: app
      image: ghcr.io/example/shop:1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        runAsNonRoot: false
