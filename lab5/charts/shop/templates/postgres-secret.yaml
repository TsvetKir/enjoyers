{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecret }}
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.owner | quote }}
  password: {{ .Values.postgres.password | quote }}
{{- end }}
