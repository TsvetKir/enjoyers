- name: List kind clusters
  ansible.builtin.command: kind get clusters
  register: kind_clusters
  changed_when: false
- name: Read recorded node image if available
  ansible.builtin.set_fact:
    selected_node_image: "{{ kind_node_image or lookup('file', state_dir + '/node-image.txt', errors='ignore') | default('', true) }}"
- name: Create cluster only when missing
  ansible.builtin.command:
    argv: "{{ ['kind', 'create', 'cluster', '--name', cluster_name, '--wait', wait_timeout | string + 's', '--kubeconfig', kubeconfig_file] + (['--image', selected_node_image] if selected_node_image else []) }}"
  when: cluster_name not in kind_clusters.stdout_lines
  changed_when: true
- name: Export dedicated kubeconfig without switching user's context
  ansible.builtin.command:
    argv: [kind, export, kubeconfig, --name, "{{ cluster_name }}", --kubeconfig, "{{ kubeconfig_file }}"]
  changed_when: false
- name: Restrict kubeconfig permissions
  ansible.builtin.file:
    path: "{{ kubeconfig_file }}"
    mode: '0600'
- name: Inspect kind node image
  ansible.builtin.command:
    argv: [docker, inspect, "{{ cluster_name }}-control-plane"]
  register: node_inspect
  changed_when: false
- name: Record node image for future recreation
  ansible.builtin.copy:
    content: "{{ (node_inspect.stdout | from_json)[0].Config.Image }}\n"
    dest: "{{ state_dir }}/node-image.txt"
    mode: '0600'
- name: Wait for all nodes
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubeconfig_file }}", --context, "{{ cluster_context }}", wait, --for=condition=Ready, nodes, --all, "--timeout={{ wait_timeout }}s"]
  changed_when: false
