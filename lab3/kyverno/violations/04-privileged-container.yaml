apiVersion: v1
kind: Pod
metadata:
  name: violation-privileged-container
  labels:
    app.kubernetes.io/name: violation-privileged-container
    app.kubernetes.io/part-of: shop
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/example/shop:1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: true
        runAsNonRoot: true
