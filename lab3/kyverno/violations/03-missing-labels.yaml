apiVersion: v1
kind: Pod
metadata:
  name: violation-missing-labels
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/example/shop:1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        runAsNonRoot: true
