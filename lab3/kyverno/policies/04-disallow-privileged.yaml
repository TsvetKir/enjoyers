apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  background: true
  validationFailureAction: Enforce
  rules:
    - name: containers-must-not-be-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - local-path-storage
      validate:
        message: "Privileged containers are not allowed."
        foreach:
          - list: request.object.spec.containers
            pattern:
              securityContext:
                privileged: false
          - list: request.object.spec.initContainers
            pattern:
              securityContext:
                privileged: false
