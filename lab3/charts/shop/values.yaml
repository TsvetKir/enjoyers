api:
  replicaCount: 3
  image:
    repository: ghcr.io/kirill-lab/shop-api
    tag: "1.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  health:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  env:
    databaseUrl: postgres://shop:shop@postgres-rw:5432/shop?sslmode=disable
    healthFail: "false"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/kirill-lab/shop-worker
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  health:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
  env:
    databaseUrl: postgres://shop:shop@postgres-rw:5432/shop?sslmode=disable
    pollInterval: 2s
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgres:
  enabled: true
  name: postgres
  instances: 1
  database: shop
  owner: shop
  credentialsSecret: shop-db-app
  password: shop
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
